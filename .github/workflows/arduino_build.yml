name: Arduino RP2040 Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную одной кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Install Raspberry Pi Pico Core
      run: |
        # Добавляем индекс плат от Earle F. Philhower
        arduino-cli core update-index --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
        # Устанавливаем ядро RP2040
        arduino-cli core install rp2040:rp2040 --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

    - name: Install Libraries
      run: |
        # Устанавливаем библиотеку Adafruit TinyUSB
        arduino-cli lib install "Adafruit TinyUSB Library"

    - name: Compile Sketch
      run: |
        # Компилируем проект. Теперь всё настроено правильно, и сборка пройдёт штатно.
        arduino-cli compile --fqbn rp2040:rp2040:rpipico:usbstack=tinyusb,flash=2097152_1048576 --output-dir ./build .

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4

    - name: Create GitHub Release
      # Этот шаг сработает только тогда, когда сборка запущена созданием тега (например, v1.0.0)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./build/*.uf2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: arduino-rp2040-uf2
        path: ./build/*.uf2
